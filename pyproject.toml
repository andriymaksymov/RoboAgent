[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RoboAgent"
version = "1.1.0"
description = "An AI coding agent with switchable LLM providers (OpenAI, Anthropic, Gemini, local) and local tools"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Andriy Maksymov"}
]
dependencies = [
    "openai",
    "anthropic",
    "google-genai",
    "python-dotenv",
    "rich",
    "GitPython",
    "chromadb",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py313']

[tool.ruff]
line-length = 100
target-version = "py311"
# Projects built by the agent live in workspace/; they are not part of the agent's code.
extend-exclude = ["workspace"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
